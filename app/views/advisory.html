<div class="card shadow p-4">
  <h3 class="text-success mb-4">Crop Recommendation Form</h3>

  <form ng-submit="getRecommendation()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Soil Type</label>
        <select class="form-select" ng-model="soil" required>
          <option value="">Select</option>
          <option>Clay</option>
          <option>Loamy</option>
          <option>Sandy</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Rainfall (mm)</label>
        <input type="number" class="form-control" ng-model="rainfall" required>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Temperature (°C)</label>
        <input type="number" class="form-control" ng-model="temperature" required>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Region</label>
        <input type="text" class="form-control" ng-model="region" required>
      </div>
    </div>

    <button type="submit" class="btn btn-success mt-4 w-100">Get Recommendations</button>
  </form>

  <div ng-if="recommendations.length" class="mt-5">
    <h4 class="text-success mb-3">Recommended Crops:</h4>
    <div class="row">
      <div class="col-md-4" ng-repeat="crop in recommendations">
        <div class="card mb-3 shadow-sm">
          <img src="assets/img/{{crop.image}}" class="card-img-top" alt="{{crop.name}}">
          <div class="card-body">
            <h5 class="card-title">{{crop.name}}</h5>
            <p class="card-text small">{{crop.description}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
