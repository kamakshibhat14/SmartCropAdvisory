<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 shadow-sm">
      <h5 class="text-success">Farmer Login</h5>
      <form ng-submit="login()">
        <div class="mb-3">
          <label>Email</label>
          <input type="email" ng-model="loginData.email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" ng-model="loginData.password" class="form-control" required>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <button class="btn btn-success">Login</button>
          <a href="#!/register">Create account</a>
        </div>
      </form>
      <div class="mt-3 text-danger">{{message}}</div>
    </div>
  </div>
</div>
