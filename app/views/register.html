<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 shadow-sm">
      <h5 class="text-success">Register as Farmer</h5>
      <form ng-submit="register()">
        <div class="mb-3">
          <label>Name</label>
          <input ng-model="registerData.name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Email</label>
          <input type="email" ng-model="registerData.email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" ng-model="registerData.password" class="form-control" required>
        </div>
        <button class="btn btn-success">Register</button>
      </form>
      <div class="mt-3 text-success">{{message}}</div>
    </div>
  </div>
</div>
